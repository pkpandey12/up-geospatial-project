# Adds the `dev` container on top of ../docker-compose.yml (devcontainer.json lists both).
# NOTE: with several compose files, relative paths resolve from the FIRST file's folder,
# i.e. the repo root, not from .devcontainer/.
services:
  db:
    # In the Dev Container the database is only reached over the compose network (db:5432),
    # so don't publish it on the host. That way a Postgres already running on your machine
    # (Homebrew, Postgres.app, apt, another container) can't block startup with
    # "port 5432 already in use". VS Code forwards it for host tools instead (forwardPorts).
    ports: !reset []

  dev:
    # Built by devcontainer.json's initializeCommand (a plain `docker build`), not by compose:
    # newer compose builds via "bake", which refuses the temporary Dockerfile the Dev Container
    # tooling generates in /tmp. A prebuilt image sidesteps that on every OS.
    image: up-siting-dev:local
    pull_policy: never               # local image only; never look for it on Docker Hub
    command: sleep infinity          # stay up; the editor attaches to it
    volumes:
      - .:/workspaces/up-geospatial-project:cached
      - dev-uv-cache:/home/vscode/.cache/uv
    environment:
      # Inside the compose network the database is the `db` service on its own port 5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dev-uv-cache:
