# Local services. Phase 0 has only the database; Airflow joins in Phase 2.
# The Dev Container adds a `dev` service on top of this file (.devcontainer/compose.yaml).
# Learn: docs/learn/docker.md and docs/learn/postgis.md
name: up-siting

services:
  db:
    # PostgreSQL 17 + PostGIS 3.6, pinned to a major-minor tag so every machine gets the same
    # database. imresamu/postgis is the multi-arch build (amd64 + arm64) by a maintainer of the
    # official postgis/postgis image, which is amd64-only and would run emulated on Apple Silicon.
    image: imresamu/postgis:17-3.6
    container_name: up-siting-db
    restart: unless-stopped
    environment:
      # Values come from .env (git-ignored) when it exists; the defaults match .env.example,
      # so the database also starts before `make setup` (e.g. when a Dev Container opens).
      POSTGRES_USER: ${POSTGRES_USER:-up_siting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-up_siting}
    ports:
      # Bound to 127.0.0.1 so the database is not exposed to your local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down`; `make db-reset` deletes it.
      - pgdata:/var/lib/postgresql/data
      # Files in /docker-entrypoint-initdb.d/ run once, on first start with an empty volume.
      # Mount single files: mounting the whole folder would hide the image's own 10_postgis.sh.
      - ./db/init/20_project.sql:/docker-entrypoint-initdb.d/20_project.sql:ro
      - ./db/smoke_test.sql:/opt/up-siting/smoke_test.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. During first-time init the server listens only on a
      # Unix socket, so a socket check would report "healthy" before init scripts finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
